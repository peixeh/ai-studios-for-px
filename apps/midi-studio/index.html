<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MIDI Studio</title>
<style>body{max-width:640px;margin:70px auto;background:#101923;color:#edf3f8;font:18px system-ui;padding:24px;line-height:1.6}button,input{font:inherit}button{padding:10px 18px;background:#e0be80;border:0;border-radius:6px;cursor:pointer}label{display:block;margin:20px 0}small{color:#aabcc9}</style>
<h1>MIDI Studio</h1><p>Abra um arquivo MIDI para ouvir em um sintetizador retrô.</p><label>Arquivo <input id="file" type="file" accept=".mid,.midi"></label><button id="play" disabled>Tocar em loop</button> <button id="stop">Parar</button><label>Volume <input id="volume" type="range" min="0" max="100" value="70"></label><p id="status" role="status">Nenhum MIDI carregado.</p><small>Agudo quadrado, baixo triangular e percussão sintética. Timbres General MIDI não são reproduzidos fielmente.</small>
<script src="midi-backing.js"></script><script>
const player=new MidiBacking(),file=document.querySelector('#file'),play=document.querySelector('#play'),status=document.querySelector('#status');let context;
player.setLevel(.07);file.onchange=async()=>{player.stop();play.disabled=true;const chosen=file.files[0];if(!chosen)return;try{const song=player.load(await chosen.arrayBuffer());status.textContent=`${chosen.name} · ${player.song.duration.toFixed(2)} s`;play.disabled=false;}catch(e){status.textContent=e.message;}};
play.onclick=async()=>{try{context??=new(window.AudioContext||window.webkitAudioContext)();await context.resume();player.play(context,0,Infinity);status.textContent='Tocando em loop.';}catch(e){status.textContent=e.message;}};document.querySelector('#stop').onclick=()=>{player.stop();status.textContent='Parado.';};document.querySelector('#volume').oninput=e=>player.setLevel(Number(e.target.value)/100*.1);window.addEventListener('pagehide',()=>player.stop());
</script></html>
